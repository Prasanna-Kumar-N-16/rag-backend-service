# Local development stack: PostgreSQL + pgvector and the RAG API.
#
#   docker compose up --build
#
# Provider keys are read from the host environment (or an .env file that Compose
# auto-loads) so no secrets are baked into the image or this file. The API boots
# health-only if the keys are absent; /v1/query and /v1/ingest need them set,
# plus API_KEY (callers must send it back as the X-API-Key header).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rag
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      API_KEY: ${API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "8000:8000"

volumes:
  pgdata:
