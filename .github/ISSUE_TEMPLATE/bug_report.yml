name: 🐛 Bug report
description: Report a defect in rag-backend-service
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! For **security vulnerabilities**, do not use
        this form — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps (or a code/curl snippet) to reproduce.
      placeholder: |
        1. Configure ...
        2. Call `POST /v1/query` with ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      description: Paste any structured log output or stack trace. Redact secrets and PII.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit SHA or release tag.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - api
        - indexing
        - retrieval
        - generation
        - guardrails
        - evaluation
        - config / infra
        - unsure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and whether the `pii` extra is installed.
      placeholder: "macOS 14, Python 3.12.3, pii extra installed"
